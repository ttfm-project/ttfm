[package]
name = "ttfm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
duckdb = { version = "1.10504.0", features = ["bundled", "parquet", "uuid"] }
walkdir = "2.4"
anyhow = "1.0"
chrono = "0.4"
chrono-english = "0.1"
dateparser = "0.2"
indicatif = "0.18.3"
wasmtime = { version = "28.0", features = ["component-model", "cranelift", "async"] }
wasmtime-wasi = "28.0"
wit-bindgen = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
rayon = "1.11.0"
file-id = "0.2.3"
ignore = "0.4.25"
sea-query = "0.32.7"
terminal_size = "0.4.3"
console = "0.16"
path-slash = "0.2"
strum = { version = "0.26", features = ["derive"] }
rustc-hash = "2.1.1"
uuid = { version = "1.19.0", features = ["v4", "v5"] }
pest = "2.7"
pest_derive = "2.7"
indexmap = "2"
glob = "0.3.3"
fs4 = "1.1"
filetime = "0.2.27"
reedline = { version = "0.47.0", default-features = false }
crossterm = "0.29"

[dev-dependencies]
filetime = "0.2.27"
tempfile = "3.24.0"
rstest = "0.25"
libc = "0.2"

# Optimize dependency build times and binary size
[profile.dev.package."*"]
debug = 0
strip = "debuginfo"

# DuckDB (C++ bundled build) は -O0 だとクエリ実行が公式バイナリ比で約10倍遅く、
# テスト全体を支配するため、ここだけ最適化してビルドする（初回のみ再コンパイルが走る）
[profile.dev.package.libduckdb-sys]
opt-level = 3

